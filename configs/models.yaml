# Model roles. Strings are 'provider/model-id' (providers: deepseek, groq, google, openrouter).
# Chosen by scripts/list_models.py + scripts/check_keys.py on 2026-11-07.
roles:
  worker:        # U: untrusted workers. DeepSeek V4 Flash (as in Makins et al.), thinking off.
    model: openrouter/deepseek/deepseek-v4-flash
    params: {extra_body: {reasoning: {enabled: false}}}
  judge:         # T: trusted judge J. Mistral-Small-24B: aligned logprobs, single-digit tokens, much weaker than U.
    model: openrouter/mistralai/mistral-small-3.2-24b-instruct
    params: {logprobs: true, top_logprobs: 20, temperature: 0, extra_body: {provider: {require_parameters: true}}}
  judge_cot:     # same T, brief statement of the combined effect before the score
    model: openrouter/mistralai/mistral-small-3.2-24b-instruct
    cot: true
    params: {logprobs: true, top_logprobs: 20, temperature: 0, extra_body: {provider: {require_parameters: true}}}
  judge_backup:  # Llama-3.1-8B: provider logprobs misaligned, so scored by the mean of 3 samples
    model: openrouter/meta-llama/llama-3.1-8b-instruct
    params: {logprobs: true, top_logprobs: 20, temperature: 0, extra_body: {provider: {require_parameters: true}}}
  embedder:      # provider-side clustering map. Voyage, as in Brown et al. (2026); via OpenRouter (Gemini free tier is rate-limited)
    model: openrouter/mongodb/voyage-4-lite
